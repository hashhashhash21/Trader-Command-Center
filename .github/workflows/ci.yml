name: TCC CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/*.test.js
      - run: node --check lib/engine.js
      - run: node --check api/market.js
      - run: node --check api/validation.js
      - run: node --check api/calibration.js
      - run: node --check api/observe.js
      - run: node --check api/evaluate.js
      - run: node --check api/consensus.js
      - run: node --check api/health.js
      - run: node --check api/snapshot.js
