name: TCC CI
on:
  push:
    branches: [main, v73-2-work]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/*.test.js
      - run: node --check lib/engine.js
      - run: node --check lib/instruments.js
      - run: node --check lib/pretrade.js
      - run: node --check lib/hourly.js
      - run: node --check lib/us-market.js
      - run: node --check api/market.js
      - run: node --check api/validation.js
      - run: node --check api/calibration.js
      - run: node --check api/observe.js
      - run: node --check api/evaluate.js
      - run: node --check api/consensus.js
      - run: node --check api/health.js
      - run: node --check api/snapshot.js
      - run: node --check api/spot-snapshot.js
      - run: node --check api/instruments.js
      - run: node --check api/pretrade.js
      - run: node --check api/us-snapshot.js
      - run: node --check api/hourly.js
      - run: node --check api/us-context.js
      - run: node --check api/news-sentiment.js
