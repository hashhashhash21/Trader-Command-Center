<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Trader Command Center Intelligence</title><style>html,body{margin:0;width:100%;height:100%;background:#0b0e11;overflow:hidden}#app{display:block;width:100%;height:100dvh;border:0;background:#0b0e11}</style></head><body><iframe id="app" src="/Index.html?runtime=65.20-matrix" title="Trader Command Center"></iframe><script>(()=>{const f=document.getElementById('app');let timer,busy=false,lastBars=[];const money=n=>Number.isFinite(+n)?(+n).toLocaleString(undefined,{maximumFractionDigits:+n>=1000?2:6}):'—',pct=n=>Number.isFinite(+n)?`${+n>=0?'+':''}${(+n).toFixed(2)}%`:'—',sym=d=>d.querySelector('.pill.active[data-symbol]')?.dataset?.symbol||'BTCUSDT',tf=d=>d.querySelector('.pill.active[data-tf]')?.dataset?.tf||'1h',set=(d,id,t,c)=>{const e=d.getElementById(id);if(e){e.textContent=t;if(c)e.className=c}};async function api(path,optional=false){try{const c=new AbortController(),t=setTimeout(()=>c.abort(),5500),r=await fetch(`/api/market?market=futures&path=${encodeURIComponent(path)}`,{cache:'no-store',signal:c.signal});clearTimeout(t);const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||`HTTP ${r.status}`);return j}catch(e){if(optional)return null;throw e}}function ema(v,p){if(!v.length)return NaN;const k=2/(p+1);let e=v[0];for(let i=1;i<v.length;i++)e=v[i]*k+e*(1-k);return e}function rsi(rows,p=14){if(!rows?.length||rows.length<p+1)return NaN;const c=rows.map(x=>+x[4]);let g=0,l=0;for(let i=c.length-p;i<c.length;i++){const d=c[i]-c[i-1];if(d>0)g+=d;else l-=d}return l?100-100/(1+(g/p)/(l/p)):100}function draw(cv,rows){if(!cv||!rows?.length)return;const R=cv.getBoundingClientRect(),W=Math.max(320,R.width||320),H=Math.max(260,R.height||320),dpr=devicePixelRatio||1;cv.width=W*dpr;cv.height=H*dpr;const c=cv.getContext('2d');c.setTransform(dpr,0,0,dpr,0,0);c.fillStyle='#0b0f14';c.fillRect(0,0,W,H);const v=rows.slice(-90),lo=Math.min(...v.map(x=>+x[3])),hi=Math.max(...v.map(x=>+x[2])),sp=Math.max(hi-lo,1e-9),pw=W-70,ph=H-36,step=pw/v.length,y=x=>12+(hi-x)/sp*ph;v.forEach((k,i)=>{const o=+k[1],h=+k[2],l=+k[3],cl=+k[4],x=8+i*step+step/2;c.strokeStyle=cl>=o?'#16c784':'#ea3943';c.fillStyle=c.strokeStyle;c.beginPath();c.moveTo(x,y(h));c.lineTo(x,y(l));c.stroke();c.fillRect(x-Math.max(1,step*.28),Math.min(y(o),y(cl)),Math.max(2,step*.56),Math.max(1,Math.abs(y(cl)-y(o))))})}function ensure(d){if(d.getElementById('intelMatrix'))return;const h=d.querySelector('.wrap')||d.body,x=d.createElement('section');x.id='intelMatrix';x.innerHTML=`<style>#intelMatrix{border:1px solid #293541;background:linear-gradient(180deg,#111923,#0d131a);border-radius:14px;padding:14px;margin:8px 0 12px;color:#e6edf3}.imtop{display:flex;justify-content:space-between;gap:12px;align-items:start}.imstate{font-size:32px;font-weight:950}.imscore{font-size:25px;font-weight:900;text-align:right}.imsub{font-size:10px;color:#8b98a7;line-height:1.4}.imgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-top:10px}.imc{background:#151c24;border:1px solid #26313d;border-radius:10px;padding:9px}.imc span{display:block;color:#8491a0;font-size:9px;text-transform:uppercase}.imc b{display:block;margin-top:4px;font-size:13px}.good{color:#16c784}.bad{color:#ea3943}.warn{color:#f0b90b}.neutral{color:#9aa4b2}.ctx{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:8px}@media(max-width:760px){.imgrid{grid-template-columns:repeat(2,1fr)}.ctx{grid-template-columns:1fr}.imstate{font-size:27px}}</style><div class="imtop"><div><div class="imsub">QUICK DECISION · CONFIRMATION / DIVERGENCE</div><div id="imState" class="imstate warn">LOADING</div><div id="imRegime" class="imsub">market regime</div></div><div><div id="imScore" class="imscore">—</div><div id="imAlign" class="imsub">evidence alignment</div></div></div><div class="imgrid"><div class="imc"><span>Trend</span><b id="imTrend">—</b></div><div class="imc"><span>Momentum</span><b id="imMom">—</b></div><div class="imc"><span>Derivatives</span><b id="imDeriv">—</b></div><div class="imc"><span>Polymarket</span><b id="imPoly">—</b></div><div class="imc"><span>Oracle</span><b id="imOracle">—</b></div></div><div class="ctx"><div class="imc"><span>Support / Resistance</span><b id="imLevels">—</b></div><div class="imc"><span>Divergence warning</span><b id="imDiv">—</b></div></div><div id="imSource" class="imsub" style="margin-top:9px">checking sources…</div>`;h.prepend(x)}async function refresh(){const d=f.contentDocument;if(!d||busy)return;busy=true;ensure(d);const s=sym(d),t=tf(d),stamp=new Date().toLocaleTimeString();try{const[tr,kr,oi,fr,ctx]=await Promise.all([api(`/fapi/v1/ticker/24hr?symbol=${s}`),api(`/fapi/v1/klines?symbol=${s}&interval=${t}&limit=180`),api(`/fapi/v1/openInterest?symbol=${s}`,true),api(`/fapi/v1/premiumIndex?symbol=${s}`,true),fetch(`/api/context?symbol=${encodeURIComponent(s)}`,{cache:'no-store'}).then(r=>r.json()).catch(()=>null)]),rows=Array.isArray(kr.data)?kr.data:[],c=rows.map(x=>+x[4]),px=Number(tr.data?.lastPrice??tr.data?.price??c.at(-1)),chg=Number(tr.data?.priceChangePercent),e20=ema(c.slice(-80),20),e50=ema(c.slice(-140),50),rv=rsi(rows),hi=Math.max(...rows.slice(-30).map(x=>+x[2])),lo=Math.min(...rows.slice(-30).map(x=>+x[3])),oiN=Number(oi?.data?.openInterest),fund=Number(fr?.data?.lastFundingRate);lastBars=rows;let trend=50+(px>e20?20:-20)+(e20>e50?20:-20),mom=50+(rv>55?20:rv<45?-20:0)+(c.at(-1)>c.at(-4)?10:-10),deriv=50+(Number.isFinite(oiN)?5:0)+(Number.isFinite(fund)?(fund<0?5:fund>0?-5:0):0);trend=Math.max(0,Math.min(100,trend));mom=Math.max(0,Math.min(100,mom));deriv=Math.max(0,Math.min(100,deriv));const core=.45*trend+.35*mom+.20*deriv,state=core>=58?'BULLISH':core<=42?'BEARISH':'NEUTRAL',aligned=[trend,mom,deriv].filter(v=>state==='BULLISH'?v>=55:state==='BEARISH'?v<=45:v>45&&v<55).length,regime=Math.abs(e20/e50-1)>.008?(e20>e50?'TRENDING UP':'TRENDING DOWN'):'RANGE',poly=(ctx?.polymarket?.markets||[]).filter(x=>Number.isFinite(x.probability)).sort((a,b)=>(b.volume||0)-(a.volume||0))[0],oracle=!!ctx?.chainlink?.data,div=(trend>=60&&mom<=40)||(trend<=40&&mom>=60)||(state==='BULLISH'&&deriv<45)||(state==='BEARISH'&&deriv>55);set(d,'price',money(px));set(d,'change',pct(chg),chg>=0?'buy':'sell');set(d,'imState',state,`imstate ${state==='BULLISH'?'good':state==='BEARISH'?'bad':'warn'}`);set(d,'imScore',`${Math.round(core)}/100`);set(d,'imAlign',`${aligned}/3 directional groups aligned`);set(d,'imRegime',`${regime} · ${s} · ${t.toUpperCase()}`);set(d,'imTrend',Math.round(trend),trend>=60?'good':trend<=40?'bad':'neutral');set(d,'imMom',`${Math.round(mom)} · RSI ${Number.isFinite(rv)?rv.toFixed(1):'—'}`,mom>=60?'good':mom<=40?'bad':'neutral');set(d,'imDeriv',Number.isFinite(oiN)||Number.isFinite(fund)?`${Math.round(deriv)} · ${oi?.source||fr?.source||'live'}`:'NO LIVE DERIVATIVES',Number.isFinite(oiN)||Number.isFinite(fund)?'neutral':'warn');set(d,'imPoly',poly?`${(poly.probability*100).toFixed(1)}% YES`:'NO RELEVANT MARKET','neutral');set(d,'imOracle',oracle?'REFERENCE AVAILABLE':'REFERENCE UNAVAILABLE',oracle?'good':'warn');set(d,'imLevels',`${money(lo)} / ${money(hi)}`);set(d,'imDiv',div?'CONFLICT DETECTED':'NO CORE CONFLICT',div?'bad':'good');set(d,'imSource',`${tr.source||'market'} · Polymarket ${poly?'context available':'not scored'} · Chainlink ${oracle?'reference available':'not available'} · updated ${stamp}. Polymarket and oracle context are confirmation-only and do not directly alter the directional score.`);const cv=d.getElementById('chart');if(cv){cv.style.display='block';draw(cv,rows)}const fb=d.getElementById('v45ChartFallback');if(fb){fb.style.display='block';draw(fb,rows)}}catch(e){set(d,'imState','DATA RETRY','imstate warn');set(d,'imSource',e?.message||'data retrying');if(lastBars.length){const cv=d.getElementById('chart');if(cv)draw(cv,lastBars)}}finally{busy=false}}f.addEventListener('load',()=>{const d=f.contentDocument;ensure(d);setTimeout(refresh,300);clearInterval(timer);timer=setInterval(refresh,5000);d.querySelectorAll('[data-symbol],[data-tf]').forEach(b=>b.addEventListener('click',()=>setTimeout(refresh,150)))})})();</script></body></html>
