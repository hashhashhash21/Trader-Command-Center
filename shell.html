<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Trader Command Center</title>
<style>html,body{margin:0;width:100%;height:100%;background:#0b0e11;overflow:hidden}#app{display:block;width:100%;height:100dvh;border:0;background:#0b0e11}</style>
</head>
<body>
<iframe id="app" title="Trader Command Center" src="/Index.html?runtime=65.15"></iframe>
<script>
(()=>{
  const frame=document.getElementById('app');
  let busy=false,timer=null;
  const pct=v=>Number.isFinite(v)?`${v>=0?'+':''}${v.toFixed(1)}%`:'—';
  const activeSymbol=d=>d.querySelector('.pill.active[data-symbol]')?.dataset?.symbol||'BTCUSDT';
  const set=(d,id,text,cls)=>{const e=d.getElementById(id);if(!e)return;e.textContent=text;if(cls)e.className=cls};
  async function proxy(path,ms=5500){
    const ctl=new AbortController(),t=setTimeout(()=>ctl.abort(),ms),started=performance.now();
    try{
      const r=await fetch(`/api/market?market=futures&path=${encodeURIComponent(path)}`,{cache:'no-store',signal:ctl.signal});
      const j=await r.json().catch(()=>({}));
      if(!r.ok)throw new Error(j?.error||`HTTP ${r.status}`);
      return {j,ms:Math.round(performance.now()-started)};
    }finally{clearTimeout(t)}
  }
  function depthStats(book){
    const clean=a=>(Array.isArray(a)?a:[]).slice(0,20).map(x=>[+x[0],+x[1]]).filter(x=>Number.isFinite(x[0])&&Number.isFinite(x[1]));
    const bids=clean(book?.bids),asks=clean(book?.asks);
    const calc=n=>{const b=bids.slice(0,n).reduce((s,[p,q])=>s+p*q,0),a=asks.slice(0,n).reduce((s,[p,q])=>s+p*q,0),z=a+b;return z?100*(b-a)/z:0};
    return {d5:calc(5),d10:calc(10),d20:calc(20)};
  }
  function delta(rows,n){
    let buy=0,total=0;
    for(const k of (Array.isArray(rows)?rows:[]).slice(-n)){const v=+k[5],tb=+k[9];if(Number.isFinite(v)&&Number.isFinite(tb)){total+=v;buy+=tb}}
    return total?100*(buy-(total-buy))/total:NaN;
  }
  async function refresh(){
    const w=frame.contentWindow,d=frame.contentDocument;
    if(!d||busy)return;busy=true;
    const sym=activeSymbol(d);
    set(d,'v49Status','updating…');
    try{
      const [dr,kr]=await Promise.all([
        proxy(`/fapi/v1/depth?symbol=${encodeURIComponent(sym)}&limit=20`),
        proxy(`/fapi/v1/klines?symbol=${encodeURIComponent(sym)}&interval=1m&limit=20`)
      ]);
      const ds=depthStats(dr.j?.data),rows=kr.j?.data||[];
      const d1=delta(rows,1),d5=delta(rows,5),d15=delta(rows,15);
      const degraded=!!(dr.j?.degraded||kr.j?.degraded||dr.j?.source==='public-spot-fallback'||kr.j?.source==='public-spot-fallback');
      const cls=v=>v>4?'v49-good':v<-4?'v49-bad':'v49-neutral';
      set(d,'v49Depth',pct(ds.d20),cls(ds.d20));
      const db=d.getElementById('v49DepthBar');if(db)db.style.width=`${Math.max(4,Math.min(100,50+ds.d20/2))}%`;
      set(d,'v49Walls',`5 ${pct(ds.d5)} · 10 ${pct(ds.d10)} · 20 ${pct(ds.d20)}`);
      set(d,'v49Delta',pct(d1),cls(d1));
      set(d,'v49DeltaSub',`1m ${pct(d1)} · 5m ${pct(d5)} · 15m ${pct(d15)}`);
      set(d,'v49Health',degraded?'DEGRADED · REST':'LIVE · REST',degraded?'v49-warn':'v49-good');
      const hb=d.getElementById('v49HealthBar');if(hb)hb.style.width=degraded?'72%':'96%';
      set(d,'v49Latency',`${Math.max(dr.ms,kr.ms)} ms · ${dr.j?.source||'proxy'}`);
      set(d,'v49OIDelta',degraded?'UNAVAILABLE · SPOT':'FUTURES AVAILABLE',degraded?'v49-warn':'v49-good');
      set(d,'v49OISub',degraded?'derivatives data unavailable on Spot fallback':'derivatives feed available');
      set(d,'v49FundingRegime',degraded?'UNAVAILABLE · SPOT':'FUTURES AVAILABLE',degraded?'v49-warn':'v49-good');
      set(d,'v49FundingAnn',degraded?'funding requires futures feed':'derivatives feed available');
      const score=(ds.d20+d5)/2,sig=score>5?'BULLISH':score<-5?'BEARISH':'MIXED';
      set(d,'v49Signal',sig,sig==='BULLISH'?'v49-good':sig==='BEARISH'?'v49-bad':'v49-neutral');
      set(d,'v49SignalSub',`depth ${pct(ds.d20)} · taker 5m ${pct(d5)}`);
      set(d,'v49Status',`${degraded?'SPOT FALLBACK':'FUTURES'} · ${new Date().toLocaleTimeString()}`);
      set(d,'v50Align',sig);
      set(d,'v50Regime',degraded?'PRICE ONLY · SPOT':'PRICE × OI');
      set(d,'v50RegSub',degraded?'OI unavailable on Spot fallback':'confirmation context');
      set(d,'v50DepthBands',`${pct(ds.d5)} / ${pct(ds.d10)} / ${pct(ds.d20)}`);
      set(d,'v50DepthSub','top 5 / 10 / 20 levels');
    }catch(e){
      set(d,'v49Status','REST DATA RETRYING');
      set(d,'v49Health','RETRYING','v49-warn');
      set(d,'v49Latency',e?.message||'market proxy unavailable');
    }finally{busy=false}
  }
  frame.addEventListener('load',()=>{clearInterval(timer);setTimeout(refresh,300);timer=setInterval(refresh,5000)});
})();
</script>
</body>
</html>
