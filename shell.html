<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Trader Command Center Intelligence</title><style>html,body{margin:0;width:100%;height:100%;background:#0b0e11;overflow:hidden}#app{display:block;width:100%;height:100dvh;border:0;background:#0b0e11}</style></head><body><iframe id="app" src="/Index.html?runtime=65.19-context" title="Trader Command Center"></iframe><script>(()=>{const f=document.getElementById('app');let timer,busy=false;const sym=d=>d.querySelector('.pill.active[data-symbol]')?.dataset?.symbol||'BTCUSDT';function ensure(d){if(d.getElementById('externalContext'))return;const h=d.querySelector('.wrap')||d.body,x=d.createElement('section');x.id='externalContext';x.innerHTML=`<style>#externalContext{border:1px solid #293541;background:#101720;border-radius:14px;padding:12px;margin:8px 0;color:#e6edf3}.xcgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.xcc{background:#151c24;border:1px solid #26313d;border-radius:10px;padding:10px}.xcc span{display:block;color:#8491a0;font-size:9px;text-transform:uppercase}.xcc b{display:block;margin-top:5px;font-size:13px}.xcsmall{font-size:10px;color:#8b98a7;margin-top:6px;line-height:1.4}@media(max-width:620px){.xcgrid{grid-template-columns:1fr}}</style><div style="font-weight:900;margin-bottom:8px">EXTERNAL MARKET CONTEXT <span style="color:#8491a0;font-size:10px">· confirmation only</span></div><div class="xcgrid"><div class="xcc"><span>Polymarket prediction context</span><b id="xcPoly">Loading…</b><div id="xcPolySub" class="xcsmall">Public prediction-market probabilities; not a price forecast.</div></div><div class="xcc"><span>Chainlink oracle context</span><b id="xcChain">Loading…</b><div id="xcChainSub" class="xcsmall">Independent oracle reference; exchange price remains primary.</div></div></div>`;const q=d.getElementById('quickDecisionCockpit');q?q.after(x):h.prepend(x)}async function refresh(){const d=f.contentDocument;if(!d||busy)return;busy=true;ensure(d);try{const s=sym(d),r=await fetch(`/api/context?symbol=${encodeURIComponent(s)}`,{cache:'no-store'}),j=await r.json();const p=j.polymarket?.markets||[],best=p.filter(x=>Number.isFinite(x.probability)).sort((a,b)=>(b.volume||0)-(a.volume||0))[0];const pe=d.getElementById('xcPoly'),ps=d.getElementById('xcPolySub');if(pe)pe.textContent=best?`${(best.probability*100).toFixed(1)}% YES`:(p.length?`${p.length} relevant markets`:'No relevant live market');if(ps)ps.textContent=best?`${best.question} · volume ${best.volume?.toLocaleString?.()||'—'} · source Polymarket`:'No probability is added to the trading score unless a relevant market is found.';const ce=d.getElementById('xcChain'),cs=d.getElementById('xcChainSub');if(ce)ce.textContent=j.chainlink?.data?'CHAINLINK FEED AVAILABLE':'CHAINLINK REFERENCE UNAVAILABLE';if(cs)cs.textContent=j.chainlink?.data?'Independent Chainlink feed metadata received. Kept separate from exchange execution price.':'Oracle endpoint unavailable; no synthetic value substituted.'}catch(e){const pe=d.getElementById('xcPoly'),ce=d.getElementById('xcChain');if(pe)pe.textContent='Context retrying';if(ce)ce.textContent='Context retrying'}finally{busy=false}}f.addEventListener('load',()=>{const d=f.contentDocument;ensure(d);setTimeout(refresh,500);clearInterval(timer);timer=setInterval(refresh,20000);d.querySelectorAll('[data-symbol]').forEach(b=>b.addEventListener('click',()=>setTimeout(refresh,300)))})})();</script></body></html>
